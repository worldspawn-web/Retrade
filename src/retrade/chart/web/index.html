<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retrade Chart</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #131722;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #d1d4dc;
      user-select: none;
    }
    #chart {
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 5;
      font-size: 12px;
      color: #787b86;
      pointer-events: none;
    }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="hud">Retrade</div>
  <div id="chart"></div>
  <script src="bridge.js"></script>
</body>
</html>
