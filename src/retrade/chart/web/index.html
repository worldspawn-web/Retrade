<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retrade Chart</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #131722;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #d1d4dc;
      user-select: none;
      position: relative;
    }
    #chart {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 5;
      font-size: 12px;
      color: #787b86;
      pointer-events: none;
    }
    .overlay-label {
      position: absolute;
      z-index: 6;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
      white-space: nowrap;
      text-shadow: 0 0 3px #131722, 0 0 3px #131722;
    }
    .overlay-label .ico {
      display: inline-block;
      flex-shrink: 0;
    }
    .overlay-label .ico-circle {
      border-radius: 50%;
      background: currentColor;
    }
    .overlay-label .ico-square {
      background: currentColor;
    }
    .overlay-label .ico-triangle-up {
      width: 0;
      height: 0;
      background: transparent;
      border-left: solid transparent;
      border-right: solid transparent;
      border-bottom: solid currentColor;
    }
    .overlay-label .ico-triangle-down {
      width: 0;
      height: 0;
      background: transparent;
      border-left: solid transparent;
      border-right: solid transparent;
      border-top: solid currentColor;
    }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="hud">Retrade</div>
  <div id="chart"></div>
  <script src="bridge.js"></script>
</body>
</html>
